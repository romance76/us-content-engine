name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to info.awesomekorean.com
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy via SSH (server builds with proper .env)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/us-content-engine
            grep -q '^GOOGLE_ANALYTICS_ID=' .env && \
              sed -i 's/^GOOGLE_ANALYTICS_ID=.*/GOOGLE_ANALYTICS_ID=G-Y340KT3286/' .env || \
              echo 'GOOGLE_ANALYTICS_ID=G-Y340KT3286' >> .env
            bash deploy.sh
            echo "Deployed successfully to info.awesomekorean.com!"
